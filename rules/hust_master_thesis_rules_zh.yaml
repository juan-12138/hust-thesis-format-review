规则模型版本: 1.0.0
规则集编号: hust-master-thesis-science-engineering-2021-phase1
名称: 华中科技大学理工科硕士学位论文格式规则模型
阶段: 阶段1规则模型，阶段2确认稿
语言: 简体中文
默认模式: 只审查，不自动修改论文
标准模板:
  文件: references/华中科技大学硕士学位论文参考模板.docx
  SHA256: 43DB10A8AFB05D346F84B9A7C08A7E811667D27660CC0018B7C047115674B9C1
  分析日期: '2026-09-12'
规则来源优先级:
- 等级: 1
  名称: 模板正文明确写出的要求
  处理原则: 优先级最高；强制性措辞按错误检查，建议性措辞一般按警告处理。
- 等级: 2
  名称: 模板中可明确识别的正确示例
  处理原则: 模板正文未规定时使用，不得覆盖一级来源。
- 等级: 3
  名称: Word 样式或 OOXML 属性
  处理原则: 作为实现证据和缺省值，必须解析继承和直接格式。
- 等级: 4
  名称: 有记录的上下文推断
  处理原则: 不得表述成学校明确规定。
严重程度说明:
  ERROR: 错误：明确违反学校模板的强制要求，或 DOCX 结构无效。
  WARNING: 警告：建议性要求、疑似问题、边界情况或规则来源存在冲突。
  MANUAL_REVIEW: 人工复核：必须结合渲染效果、语义、学术内容或上下文判断。
  PASS: 通过：已完成检查且符合要求。
自动化程度说明:
  AUTOMATIC: 自动检查：可以从 DOCX/OOXML 稳定、确定地判断。
  SEMI_AUTOMATIC: 半自动检查：程序能够定位候选问题，但需要上下文或人工确认。
  MANUAL_REVIEW: 人工检查：不能仅凭 OOXML 得出可靠结论。
有效格式解析顺序:
  run_properties:
  - 文字直接格式
  - 字符样式
  - 段落样式
  - 样式 basedOn 继承链
  - 适用时的表格样式
  - 文档默认值
  - 主题字体或颜色回退
  paragraph_properties:
  - 段落直接格式
  - 段落样式
  - 样式 basedOn 继承链
  - 适用时的表格样式
  - 文档默认值
  notes:
  - 中文、英文/数字和复杂文字字体必须分别解析。
  - 不能把样式名称直接当作最终有效格式。
  - 页脚可能通过制表位实现视觉居中，不能只读取段落对齐属性。
通用批注模板: '【格式审查：{rule_id}】

  问题：{problem}

  当前：{actual}

  要求：{expected}

  依据：{source}

  建议：{suggestion}

  严重程度：{severity}'
已记录冲突:
- 冲突编号: CONFLICT-TOC-001
  主题: 目录字号
  冲突证据: 模板正文要求四号（14 磅）、固定值 25 磅；模板 TOC 1/TOC 2 样式实际保存为 10 磅。
  处理原则: 执行一级来源的 14 磅和固定值 25 磅；保留 10 磅样式事实并在报告中说明。
- 冲突编号: CONFLICT-EQ-001
  主题: 公式编号形式
  冲突证据: 文字说明采用按章编号并出现“2-3”，可见示例为“(2.1)”。
  处理原则: 必须按章连续编号；优先接受“(2-3)”，点号、短横线和圆括号差异按警告或人工复核处理。
- 冲突编号: CONFLICT-HF-001
  主题: 页眉字体、字号和颜色
  冲突证据: 正文明确写明楷体、小二（18 磅），实际页眉 XML 为华文楷体、16.5 磅、红色并带红色双线。
  处理原则: 字体和字号执行一级文字要求；红色文字和双线作为模板外观要求检查，同时披露冲突。
- 冲突编号: CONFLICT-FOOTER-001
  主题: 页码对齐方式
  冲突证据: 页码视觉居中，但 Footer 样式为左对齐，实际通过制表位定位。
  处理原则: 按最终有效位置判断居中，不能只检查段落的 w:jc 属性。
